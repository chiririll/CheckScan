group = "com.checkscan.providers_native"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.checkscan.providers_native"
    compileSdk = 36

    defaultConfig {
        minSdk = 24
    }

    sourceSets {
        main.jniLibs.srcDirs += ["src/main/jniLibs"]
    }
}

tasks.register("assertNativeLibs") {
    doFirst {
        def jni = file("src/main/jniLibs")
        def soFiles = fileTree(jni).include("**/libcheckscan.so")
        if (soFiles.isEmpty()) {
            throw new GradleException(
                "libcheckscan.so is missing. Run scripts/build_android_native.ps1 from the CheckScan repo root."
            )
        }
    }
}

tasks.named("preBuild").configure { dependsOn("assertNativeLibs") }
