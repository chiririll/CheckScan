name: checkscan
description: QR receipt scanner with adapter chain and local history.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adapter_core:
    path: packages/adapter_core
  adapter_eq_payload:
    path: packages/adapter_eq_payload
  adapter_ru_fns:
    path: packages/adapter_ru_fns
  crypto: ^3.0.7
  image_picker: ^1.2.3
  intl: ^0.20.2
  mobile_scanner: ^7.4.0
  path: ^1.9.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0

flutter:
  generate: true
  uses-material-design: true
