name: checkscan
description: QR receipt scanner with adapter chain and local history.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  adapter_core:
    path: packages/adapter_core
  adapter_eq_payload:
    path: packages/adapter_eq_payload
  adapter_ru_fns:
    path: packages/adapter_ru_fns
  crypto: ^3.0.6
  image_picker: ^1.1.2
  intl: ^0.20.2
  mobile_scanner: ^6.0.2
  path: ^1.9.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  generate: true
  uses-material-design: true
